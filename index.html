<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>乘方的值練習</title>
<style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;color:#203047;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.app{max-width:680px;margin:auto;background:white;border-radius:20px;padding:26px;box-shadow:0 8px 32px #23345112}h1{margin:0 0 8px;font-size:29px}p{line-height:1.7}.muted{color:#637187}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{flex:1;min-width:125px}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #b8c4d5;font-size:18px;background:#fff}button{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:13px 20px;font-weight:700}button.primary{background:#2365c8;color:white}button.secondary{background:#e9eff8;color:#22436d}button:disabled{opacity:.45;cursor:default}.wide{width:100%;margin-top:16px}.hidden{display:none!important}.question{text-align:center;background:#f4f7fc;padding:25px 10px;border-radius:16px;margin:20px 0}.math{font-family:Arial,'Microsoft JhengHei',sans-serif;font-size:clamp(32px,7vw,48px);font-weight:600;letter-spacing:1px}.math sup{font-size:.56em;vertical-align:super}.pill{display:inline-block;background:#edf3ff;color:#305c9c;border-radius:30px;padding:7px 13px;font-size:14px}.choice{flex:1;min-width:115px;border:2px solid #bac9e0;background:white;color:#203047;font-size:20px}.choice.active{background:#e2efff;border-color:#2365c8;color:#14488f}.notice{padding:15px;border-radius:12px;background:#f1f5fa;margin:14px 0;line-height:1.7}.notice.warn{background:#fff4da;color:#70521c}.notice.ok{background:#e8f6ed;color:#166c39}.notice.bad{background:#fff0ef;color:#a52f2f}.metric{flex:1;min-width:140px;padding:16px;background:#f0f5fd;border-radius:14px;text-align:center}.metric strong{display:block;font-size:26px;margin-top:7px}.score-name{font-size:18px;line-height:1.7}.small{font-size:14px}.history{max-height:260px;overflow:auto;border-top:1px solid #d8e0ea;margin-top:14px}.history div{padding:8px 0;border-bottom:1px solid #e5e9ee}.header{display:flex;justify-content:space-between;align-items:center;gap:8px}.step{font-weight:700;font-size:18px;margin:16px 0 10px}@media print{body{background:white;padding:0}.app{box-shadow:none;padding:8px}button{display:none!important}.history{max-height:none;overflow:visible}}
</style>
</head><body><main class="app">
<section id="setup"><h1>乘方的值練習</h1><p class="muted">先判斷正負，再計算完整答案。題目中的括號要看仔細！</p><div class="row"><div class="field"><label for="cls">班級</label><input id="cls" placeholder="例如 701" autocomplete="off"></div><div class="field"><label for="seat">座號</label><input id="seat" placeholder="例如 08" autocomplete="off"></div><div class="field"><label for="student">姓名</label><input id="student" placeholder="請輸入姓名" autocomplete="off"></div></div><label for="count">練習題數</label><select id="count"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="20">20 題</option></select><button class="primary wide" id="start">開始練習</button></section>
<section id="practice" class="hidden"><div class="header"><h1>乘方的值練習</h1><span class="pill" id="progress"></span></div><div class="question"><div class="math" id="expression"></div></div><div id="signPanel"><div class="step">① 判斷答案的正負號</div><div class="row"><button class="choice" data-sign="positive">正數（＋）</button><button class="choice" data-sign="negative">負數（−）</button></div><div id="hint" class="notice warn hidden"></div><button id="checkSign" class="primary wide" disabled>確定正負號</button></div><div id="valuePanel" class="hidden"><div id="signNotice" class="notice"></div><div class="step">② 輸入完整答案（包含負號）</div><input id="answer" inputmode="numeric" type="text" placeholder="例如 -27" autocomplete="off"><button class="primary wide" id="checkAnswer">確認答案</button></div><div id="feedback" class="hidden"><div class="notice" id="feedbackText"></div><button id="next" class="primary wide">下一題</button></div></section>
<section id="results" class="hidden"><h1>乘方的值練習｜成績</h1><p id="identity" class="score-name"></p><div class="row"><div class="metric">正負首次判對<strong id="signScore"></strong></div><div class="metric">完整答案答對<strong id="valueScore"></strong></div></div><p class="muted small">正負分數只計第一次判斷；完整答案分數只計第一次提交。</p><div id="resultDetails" class="history"></div><p class="notice ok" style="text-align:center;font-weight:700">📸 請先截圖成績畫面，上傳 Google Classroom 繳交。</p><button id="again" class="primary wide">重新練習</button><button id="edit" class="secondary wide">換人練習</button></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let questions=[],index=0,chosen=null,tries=0,firstCorrect=false,record=[];
const show=name=>['setup','practice','results'].forEach(x=>$(x).classList.toggle('hidden',x!==name));
const pow=(b,e)=>Math.pow(b,e);
const all=[];
for(let exp=2;exp<=5;exp++){
 const max={2:10,3:5,4:3,5:2}[exp];
 for(let n=1;n<=max;n++){
   // positive base, negative base in parentheses, minus outside power
   all.push({kind:'positive',n,exp,value:pow(n,exp)});
   all.push({kind:'paren',n,exp,value:pow(-n,exp)});
   all.push({kind:'outside',n,exp,value:-pow(n,exp)});
 }
}
function markup(q){return (q.kind==='positive'?`${q.n}`:q.kind==='paren'?`(−${q.n})`:`−${q.n}`)+`<sup>${q.exp}</sup> = ?`}
function plain(q){return (q.kind==='positive'?`${q.n}`:q.kind==='paren'?`(−${q.n})`:`−${q.n}`)+`^${q.exp}`}
function expMarkup(q){const b=q.kind==='paren'?`(−${q.n})`:String(q.n);const chain=Array(q.exp).fill(b).join(' × ');return q.kind==='outside'?`−(${chain}) = ${q.value}`:`${chain} = ${q.value}`}
function shuffle(xs){const a=xs.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function createSet(size){const groups=['positive','paren','outside'].map(kind=>shuffle(all.filter(q=>q.kind===kind)));const selected=[];let k=0;while(selected.length<size){const g=groups[k%3];if(g.length)selected.push(g.pop());k++}return shuffle(selected)}
function begin(){const cls=$('cls').value.trim(),seat=$('seat').value.trim(),student=$('student').value.trim();if(!cls||!seat||!student){alert('請填寫班級、座號和姓名。');return}questions=createSet(Number($('count').value));index=0;record=[];show('practice');load()}
function load(){const q=questions[index];tries=0;chosen=null;firstCorrect=false;$('progress').textContent=`第 ${index+1}／${questions.length} 題`;$('expression').innerHTML=markup(q);$('signPanel').classList.remove('hidden');$('valuePanel').classList.add('hidden');$('feedback').classList.add('hidden');$('hint').classList.add('hidden');$('checkSign').disabled=true;$('checkSign').textContent='確定正負號';$('answer').value='';document.querySelectorAll('[data-sign]').forEach(el=>el.classList.remove('active'))}
function sign(){const q=questions[index];if(!chosen)return;tries++;const right=(q.value>0?'positive':'negative')===chosen;if(tries===1)firstCorrect=right;if(right){enterValue('正負號判斷正確！')}else if(tries===1){$('hint').classList.remove('hidden');$('hint').innerHTML=`再想想！<br>${q.kind==='outside'?'注意括號：負號在乘方符號的外面，先計算乘方，再處理前面的負號。':q.kind==='paren'?`展開看看：${Array(q.exp).fill(`(−${q.n})`).join(' × ')}，有幾個負因數？`:`展開看看：${Array(q.exp).fill(q.n).join(' × ')}，結果是正還是負？`}`;$('checkSign').textContent='重新確認正負號';chosen=null;$('checkSign').disabled=true;document.querySelectorAll('[data-sign]').forEach(el=>el.classList.remove('active'))}else{enterValue('第二次判斷仍不正確。正確應為「'+(q.value>0?'正數':'負數')+'」。') }}
function enterValue(note){$('signPanel').classList.add('hidden');$('valuePanel').classList.remove('hidden');$('signNotice').textContent=note;$('answer').focus()}
function answer(){const raw=$('answer').value.trim().replace(/−/g,'-').replace(/＋/g,'+');if(!/^[+-]?\d+$/.test(raw)){alert('請輸入完整的整數答案，例如 -27。');return}const q=questions[index];const correct=Number(raw)===q.value;record.push({q,firstCorrect,correct,typed:raw,tries});$('valuePanel').classList.add('hidden');$('feedback').classList.remove('hidden');$('feedbackText').className='notice '+(correct?'ok':'bad');$('feedbackText').innerHTML=`<strong>${correct?'完整答案正確！':'完整答案不正確。'}</strong><br>正確答案：${q.value}<br><span class="small">展開：${expMarkup(q)}</span>`;$('next').textContent=index===questions.length-1?'查看成績':'下一題'}
function finish(){show('results');$('identity').textContent=`班級：${$('cls').value.trim()}　座號：${$('seat').value.trim()}　姓名：${$('student').value.trim()}　｜ 共 ${record.length} 題`;$('signScore').textContent=`${record.filter(r=>r.firstCorrect).length} / ${record.length}`;$('valueScore').textContent=`${record.filter(r=>r.correct).length} / ${record.length}`;$('resultDetails').innerHTML=record.map((r,i)=>`<div>${i+1}. ${plain(r.q)} = ${r.q.value}　｜正負首次：${r.firstCorrect?'✓':'✗'}　｜完整答案：${r.correct?'✓':'✗'}</div>`).join('')}
$('start').addEventListener('click',begin);document.querySelectorAll('[data-sign]').forEach(el=>el.addEventListener('click',()=>{chosen=el.dataset.sign;$('checkSign').disabled=false;document.querySelectorAll('[data-sign]').forEach(x=>x.classList.toggle('active',x===el))}));$('checkSign').addEventListener('click',sign);$('checkAnswer').addEventListener('click',answer);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});$('next').addEventListener('click',()=>{index++;if(index<questions.length)load();else finish()});$('again').addEventListener('click',begin);$('edit').addEventListener('click',()=>show('setup'));
})();
</script></body></html>
